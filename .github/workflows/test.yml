name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - name: No personal paths in shipped files
        if: runner.os == 'Linux'
        run: "! git grep -nE '([A-Za-z]:.{1,2}Users.|/Users/[a-z]|/home/[a-z])' -- ':!test/**' ':!docs/plans/**' ':!publish.sh'"
